<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="avatarBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="avatarBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Glowing Outer Ring -->
  <circle cx="100" cy="100" r="96" fill="url(#avatarBg)" stroke="url(#avatarBorder)" stroke-width="4" />

  <!-- Stylized Developer Silhouette -->
  <!-- Shoulders -->
  <path d="M 40 180 C 40 140, 65 125, 100 125 C 135 125, 160 140, 160 180 Z" fill="#334155" />
  <path d="M 55 180 C 55 145, 75 135, 100 135 C 125 135, 145 145, 145 180 Z" fill="#475569" />

  <!-- Head -->
  <circle cx="100" cy="80" r="35" fill="#e2e8f0" />
  
  <!-- Modern Hair -->
  <path d="M 65 80 C 65 50, 80 40, 100 40 C 120 40, 135 50, 135 75 C 130 65, 115 58, 100 58 C 80 58, 70 70, 65 80 Z" fill="#1e293b" />

  <!-- Code Glasses -->
  <rect x="75" y="72" width="20" height="14" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <rect x="105" y="72" width="20" height="14" rx="4" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <line x1="95" y1="79" x2="105" y2="79" stroke="#38bdf8" stroke-width="2" />

  <!-- Code symbol in glasses reflection -->
  <text x="79" y="83" fill="#38bdf8" font-family="monospace" font-size="8">&lt;/&gt;</text>
  <text x="109" y="83" fill="#38bdf8" font-family="monospace" font-size="8">{;}</text>
</svg>
