<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="lineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad1)" rx="16" />
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="450" />
    <line x1="150" y1="0" x2="150" y2="450" />
    <line x1="250" y1="0" x2="250" y2="450" />
    <line x1="350" y1="0" x2="350" y2="450" />
    <line x1="450" y1="0" x2="450" y2="450" />
    <line x1="550" y1="0" x2="550" y2="450" />
    <line x1="650" y1="0" x2="650" y2="450" />
    <line x1="750" y1="0" x2="750" y2="450" />
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="180" x2="800" y2="180" />
    <line x1="0" y1="280" x2="800" y2="280" />
    <line x1="0" y1="380" x2="800" y2="380" />
  </g>

  <!-- Window Header -->
  <rect x="30" y="30" width="740" height="40" rx="8" fill="#1e293b" opacity="0.6" />
  <circle cx="55" cy="50" r="5" fill="#f43f5e" />
  <circle cx="75" cy="50" r="5" fill="#eab308" />
  <circle cx="95" cy="50" r="5" fill="#22c55e" />
  <rect x="250" y="42" width="300" height="16" rx="8" fill="#334155" opacity="0.5" />
  <text x="350" y="54" fill="#94a3b8" font-family="monospace" font-size="11">cloudscale.metrics/live</text>

  <!-- Metric Stat Cards -->
  <rect x="50" y="90" width="210" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="70" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">Total Ingestion Rate</text>
  <text x="70" y="152" fill="#38bdf8" font-family="sans-serif" font-weight="bold" font-size="24">184.2 k/s</text>
  <path d="M 210 145 L 225 130 L 240 135 L 248 122" fill="none" stroke="#34d399" stroke-width="2" />

  <rect x="295" y="90" width="210" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="315" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">P99 Query Latency</text>
  <text x="315" y="152" fill="#818cf8" font-family="sans-serif" font-weight="bold" font-size="24">12.4 ms</text>
  <path d="M 455 125 L 470 140 L 485 132 L 495 145" fill="none" stroke="#818cf8" stroke-width="2" />

  <rect x="540" y="90" width="210" height="90" rx="10" fill="#1e293b" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="560" y="120" fill="#94a3b8" font-family="sans-serif" font-size="12">System Health</text>
  <text x="560" y="152" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="24">99.99%</text>
  <circle cx="720" cy="135" r="7" fill="#34d399" />

  <!-- Main Chart Card -->
  <rect x="50" y="200" width="700" height="210" rx="12" fill="#0f172a" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="75" y="235" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="600">Telemetry Heatmap &amp; Cluster Throughput</text>

  <!-- Chart line with gradient -->
  <path d="M 80 370 Q 150 330, 220 340 T 360 280 T 500 310 T 640 260 L 720 250" 
        fill="none" stroke="url(#lineGrad1)" stroke-width="4" stroke-linecap="round" />
  
  <!-- Bar columns in chart background -->
  <rect x="120" y="310" width="20" height="60" rx="4" fill="url(#barGrad1)" opacity="0.3" />
  <rect x="180" y="290" width="20" height="80" rx="4" fill="url(#barGrad1)" opacity="0.4" />
  <rect x="240" y="320" width="20" height="50" rx="4" fill="url(#barGrad1)" opacity="0.3" />
  <rect x="300" y="270" width="20" height="100" rx="4" fill="url(#barGrad1)" opacity="0.5" />
  <rect x="360" y="250" width="20" height="120" rx="4" fill="url(#barGrad1)" opacity="0.6" />
  <rect x="420" y="280" width="20" height="90" rx="4" fill="url(#barGrad1)" opacity="0.4" />
  <rect x="480" y="260" width="20" height="110" rx="4" fill="url(#barGrad1)" opacity="0.5" />
  <rect x="540" y="290" width="20" height="80" rx="4" fill="url(#barGrad1)" opacity="0.4" />
  <rect x="600" y="240" width="20" height="130" rx="4" fill="url(#barGrad1)" opacity="0.7" />
  <rect x="660" y="230" width="20" height="140" rx="4" fill="url(#barGrad1)" opacity="0.8" />
</svg>
